name: fine_foods
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.15.2
  get: ^4.7.2
  cloud_firestore: ^5.6.12
  uuid: ^4.5.1
  pdf: ^3.10.8
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  share_plus: ^11.0.0
  crypto: ^3.0.6
  intl: ^0.20.2
  device_info_plus: ^11.5.0
  open_file: ^3.5.10
  printing: ^5.14.2
  build: ^3.0.0
  logging: ^1.3.0
  flutter_pdfview: ^1.4.1+1
  google_fonts: ^8.1.0
  bluetooth_print_plus: ^2.4.6
  app_settings: ^6.1.1
  get_storage: ^2.1.1
  animated_notch_bottom_bar: ^1.0.3
  file_saver: ^0.3.1
  flutter_esc_pos_utils: ^1.0.1
  month_picker_dialog: ^6.7.0
  firebase_auth: ^5.7.0
  fl_chart: ^0.70.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.6
  flutter_launcher_icons: ^0.14.4
  msix: ^3.16.9

# icon setting
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  web:
    generate: true
    image_path: "assets/images/logo.png"
    background_color: "#ffffff"
    theme_color: "#000000"
  windows:
    generate: true
    image_path: "assets/images/logo.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/images/logo.png"

# splash screen
flutter_native_splash:
  color: "#000000"
  image: "assets/images/logo.png"
  android: true
  ios: true
  android_12:
    image: "assets/images/logo.png"
    icon_background_color: "#000000"
    image_dark: "assets/images/logo.png"
    icon_background_color_dark: "#000000"

msix_config:
  display_name: Fine Foods POS
  publisher_display_name: Deepak Das
  identity_name: DeepakDas.FineFoodsPOS
  msix_version: 1.0.0.0
  publisher: CN=F9B34059-13E3-48E0-B232-0ABC94423C59
  logo_path: assets/images/logo.png
  capabilities: internetClient, bluetooth, location

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/fonts/
