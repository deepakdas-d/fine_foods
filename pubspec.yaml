name: fine_foods
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.15.2
  get: ^4.7.2
  cloud_firestore: ^5.6.12
  uuid: ^4.5.1
  pdf: ^3.11.3
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  share_plus: ^11.0.0
  crypto: ^3.0.6
  intl: ^0.20.2
  device_info_plus: ^11.5.0
  open_file: ^3.5.10
  printing: ^5.14.2
  build: ^3.0.0
  logging: ^1.3.0
  flutter_pdfview: ^1.4.1+1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.6
  flutter_launcher_icons: ^0.14.4

# icon setting
flutter_launcher_icons: 
    android: "launcher_icon"
    ios: true
    image_path: "assets/images/logo.png"
    web:
      generate: true
      image_path: "assets/images/logo.png"
      background_color: "#ffffff"
      theme_color: "#000000"
    windows:
      generate: true
      image_path: "assets/images/logo.png"
      icon_size: 48
    macos:
      generate: true
      image_path: "assets/images/logo.png"

# splash screen
flutter_native_splash:
  color: "#000000"
  image: "assets/images/logo.png"
  android: true
  ios: true
  android_12:
    image: "assets/images/logo.png"
    icon_background_color: "#000000"
    image_dark: "assets/images/logo.png"
    icon_background_color_dark: "#000000"

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
